<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>扩展设置 - Thunderbird Plus</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>扩展设置</h1>

    <h2 class="settings-group-title">通用设置</h2>
    
    <div class="section">
      <label for="notesIcon">左侧备忘录图标：</label>
      <select id="notesIcon">
        <option value="icons/notes.svg">默认（黄色实体样式）</option>
        <option value="icons/notes-clipboard.svg">跟随主题（剪贴板线框样式）</option>
        <option value="icons/notes-notebook.svg">跟随主题（笔记本线框样式）</option>
      </select>
    </div>

    <h2 class="settings-group-title">翻译与 AI 设置</h2>

    <div class="section">
      <label for="provider">选择 AI 服务：</label>
      <select id="provider">
        <option value="ollama">Ollama (本地)</option>
        <option value="volcano">字节火山引擎</option>
        <option value="aliyun">阿里云百炼</option>
        <option value="google">Google Translate API</option>
        <option value="libretranslate">LibreTranslate</option>
        <option value="custom">自定义 OpenAI 兼容接口</option>
      </select>
    </div>

    <div class="section" id="apiUrlSection">
      <label for="apiUrl">API 地址：</label>
      <input type="text" id="apiUrl" placeholder="例如: http://localhost:11434">
      <p class="hint" id="apiUrlHint">Ollama 默认地址: http://localhost:11434</p>
    </div>

    <div class="section" id="apiKeySection">
      <label for="apiKey">API 密钥：</label>
      <input type="password" id="apiKey" placeholder="输入你的 API 密钥">
      <p class="hint">留空表示不需要密钥</p>
    </div>

    <div class="section" id="modelSection">
      <label for="model">模型名称：</label>
      <div class="model-select-container">
        <select id="model" style="flex: 1;">
          <option value="">-- 请先刷新模型列表 --</option>
        </select>
        <button id="refreshModels" type="button" title="刷新模型列表">🔄</button>
      </div>
      <input type="text" id="modelManual" placeholder="或手动输入模型名称" style="margin-top: 8px;">
      <p class="hint" id="modelHint">Ollama 默认模型: llama3.1</p>
    </div>

    <div class="section">
      <label for="targetLang">目标翻译语言：</label>
      <select id="targetLang">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    <div class="section">
      <label for="systemPrompt">自定义系统提示词（System Prompt）：</label>
      <textarea id="systemPrompt" rows="4" placeholder="输入自定义系统提示词"></textarea>
      <p class="hint">留空使用默认提示词</p>
    </div>

    <div class="buttons">
      <button id="save">保存设置</button>
      <button id="test">测试连接</button>
    </div>

    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
