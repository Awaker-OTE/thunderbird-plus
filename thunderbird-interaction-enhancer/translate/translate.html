<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>邮件翻译</title>
  <link rel="stylesheet" href="translate.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>邮件翻译</h2>
      <button id="closeBtn" title="关闭" aria-label="关闭">
        <!-- Lucide: x -->
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>
    <div class="content">
      <div class="original-section">
        <h3>原文</h3>
        <div id="originalText" class="text-box"></div>
      </div>
      <div class="translated-section">
        <h3>译文</h3>
        <div id="translatedText" class="text-box">
          <div class="loading">正在翻译...</div>
        </div>
      </div>
    </div>
    <div class="footer">
      <span id="providerInfo"></span>
      <button id="settingsBtn" type="button">
        <!-- Lucide: settings -->
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span>设置</span>
      </button>
      <button id="retryBtn" style="display:none;">重试</button>
    </div>
  </div>
  <script src="translate.js"></script>
</body>
</html>
